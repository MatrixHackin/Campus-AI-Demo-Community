apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ssh-gateway-bridge
  namespace: campus-ai-system
  labels:
    app.kubernetes.io/managed-by: campus-ai
    campus-ai/migration: ssh-gateway-noncompetition
spec:
  selector:
    matchLabels:
      campus-ai/gateway-pool: bridge-noncompetition
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ssh-gateway
        campus-ai/gateway-pool: bridge-noncompetition
        campus-ai/migration: ssh-gateway-noncompetition
    spec:
      nodeSelector:
        campus-ai/ssh-gateway: "true"
      terminationGracePeriodSeconds: 60
      containers:
        - name: ssh-gateway
          image: gpunion2.io/library/campus-ai-ssh-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: production
            - name: SSH_GATEWAY_ENABLED
              value: "true"
            - name: SSH_GATEWAY_HOST
              value: 0.0.0.0
            - name: SSH_GATEWAY_PORT
              value: "2222"
            - name: SSH_GATEWAY_HOST_KEY_PATH
              value: /etc/campus-ai/ssh/ssh_gateway_host_key
            - name: SSH_GATEWAY_TARGET_MODE
              value: service
            - name: SSH_GATEWAY_RESOLVER_MODE
              value: http
            - name: SSH_GATEWAY_CONTROL_PLANE_BASE_URL
              value: http://10.120.17.138:8080
            - name: SSH_GATEWAY_CONTROL_PLANE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ssh-gateway-control-plane
                  key: token
            - name: SSH_GATEWAY_CONTROL_PLANE_TIMEOUT_SECONDS
              value: "5"
          volumeMounts:
            - name: ssh-host-key
              mountPath: /etc/campus-ai/ssh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: ssh-host-key
          secret:
            secretName: ssh-gateway-host-key
            defaultMode: 0600
